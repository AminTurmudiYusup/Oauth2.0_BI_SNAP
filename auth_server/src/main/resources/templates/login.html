<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 350px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #111827;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #4338ca;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .logout {
            color: green;
            font-size: 13px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Login</h2>

    <!-- Error message -->
    <div class="error" th:if="${param.error}">
        Invalid username or password
    </div>

    <!-- Logout message -->
    <div class="logout" th:if="${param.logout}">
        You have been logged out
    </div>

    <form method="post" th:action="@{/login}">
        <input name="username" placeholder="Username" required type="text"/>
        <input name="password" placeholder="Password" required type="password"/>

        <button type="submit">Sign In</button>
    </form>
</div>

</body>
</html>

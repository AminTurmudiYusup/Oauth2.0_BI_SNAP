<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Authorize Application</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
            color: #111827;
        }

        p {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .client {
            font-weight: bold;
            color: #4f46e5;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .approve {
            background: #4f46e5;
            color: white;
        }

        .approve:hover {
            background: #4338ca;
        }

        .deny {
            background: #e5e7eb;
            color: #374151;
        }

        .deny:hover {
            background: #d1d5db;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Authorize Access</h2>

    <p>
        <span class="client" th:text="${client.clientId}">My App</span>
        wants to access your account.
    </p>

    <div style="text-align: left; margin-bottom: 20px;">
        <p>This app will be able to:</p>
        <ul>
            <li th:each="s : ${scopes}" th:text="${s}"></li>
        </ul>
    </div>

    <form method="post" th:action="@{/api/v1/authorize}">
        <input name="client_id" th:value="${client.clientId}" type="hidden"/>
        <input name="redirect_uri" th:value="${redirectUri}" type="hidden"/>
        <input name="scope" th:value="${scope}" type="hidden"/>
        <input name="state" th:value="${state}" type="hidden"/>

        <div class="buttons">
            <button class="approve" name="decision" type="submit" value="yes">
                Approve
            </button>

            <button class="deny" name="decision" type="submit" value="no">
                Deny
            </button>
        </div>
    </form>

    <div class="footer">
        You can revoke access anytime from your account settings.
    </div>
</div>

</body>
</html>
